<div class="form-card" style="
  background: #fcfcfc;
  border: 1px solid #f0f0f0;
  border-radius: 6px;
  padding: 16px;
  margin-bottom: 20px;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
">
  <!-- Badge -->
  <div style="
    display: inline-block;
    background: #eef2f5;
    color: #555;
    font-weight: 700;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    text-transform: uppercase;
    margin-bottom: 12px;
  ">
    Analysis Pipeline Input
  </div>

  <style>
    .form-card form { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .form-card form p { margin: 0; padding: 0; display: flex; align-items: center; gap: 8px; flex-grow: 1; }
    .form-card form label { font-size: 13px; color: #333; font-weight: 600; }
    .form-card form input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; width: 100%; font-family: inherit; outline: none; }
    .form-card form input:focus { border-color: #0066cc; }
    .form-card .submit-btn { background-color: #222; color: #fff; padding: 8px 18px; border: none; border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer; height: 35px; }
    .form-card .submit-btn:hover { background-color: #444; }

    .sample-repo-card { background: #ffffff; border: 1px solid #e8e8e8; border-radius: 4px; padding: 8px 10px; cursor: pointer; transition: all 0.15s ease; display: flex; flex-direction: column; gap: 3px; }
    .sample-repo-card:hover { border-color: #0066cc; background: #f4f8fc; }
    .sample-repo-card .repo-name { font-family: ui-monospace, monospace; font-weight: bold; color: #0066cc; font-size: 11px; }
    .sample-repo-card .repo-desc { color: #666; font-size: 11px; line-height: 1.3; }
  </style>

  <!-- Main form -->
  <form method="post" id="pipeline-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="submit-btn" type="submit">Analyse</button>
  </form>

  <!-- Component -->
  {% include "_benchmark_and_rules.html" %}
</div>
